name: Deploy iOS to TestFlight

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies and Build
        run: |
          cd dashboard
          npm ci
          npm run build

      # Sync and force-patch all configuration files on the runner layer
      - name: Sync and Patch Capacitor iOS Project
        run: |
          cd dashboard
          npx cap add ios || true
          npx cap sync ios
          
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          
          node -e "
          const fs = require('fs');
          const path = 'ios/App/Podfile';
          let content = fs.readFileSync(path, 'utf8');
          const searchStr = 'target.build_configurations.each do |config|';
          const replacement = searchStr + \"\\n      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\";
          if (content.includes(searchStr)) {
            content = content.replace(searchStr, replacement);
            fs.writeFileSync(path, content, 'utf8');
            console.log('Successfully patched Podfile.');
          }
          "
          
          cd ios/App
          pod install

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build and Archive App
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          cd dashboard/ios/App

          PROFILE_NAME=\$(security error_check 2>/dev/null || strings ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision | grep -A 1 "<key>Name</key>" | tail -n 1 | sed -e 's/<string>//' -e 's/<\/string>//' | xargs)
          echo "Compiling with manual profile: \$PROFILE_NAME"

          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            clean archive \
            -archivePath App.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=\$TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="\$PROFILE_NAME"

      - name: Export IPA File
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          cd dashboard/ios/App
          
          PROFILE_NAME=\$(security error_check 2>/dev/null || strings ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision | grep -A 1 "<key>Name</key>" | tail -n 1 | sed -e 's/<string>//' -e 's/<\/string>//' | xargs)

          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>compileBitcode</key>
              <false/>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.glidesports.glide</key>
                  <string>\$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive -archivePath App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath output
          
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'dashboard/ios/App/output/App.ipa'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}