name: Deploy iOS to TestFlight

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install Dependencies and Build
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Sync Capacitor iOS Project
        run: |
          cd dashboard
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods and Generate Workspace
        run: |
          cd dashboard/ios/App
          pod install

      - name: Generate App Icons on Runner
        run: |
          cd dashboard
          npx @capacitor/assets generate --ios

      # Force the native project files to match the ever-increasing GitHub Run number
      - name: Auto-Increment Native iOS Build Version
        run: |
          cd dashboard/ios/App
          xcrun agvtool what-version
          xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build and Archive App
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          cd dashboard/ios/App

          PROFILE_NAME=$(strings ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision | grep -A 1 "<key>Name</key>" | tail -n 1 | sed -e 's/<string>//' -e 's/<\/string>//' | xargs)
          echo "Baking explicit manual parameters: $PROFILE_NAME"

          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            clean archive \
            -archivePath App.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=$TEAM_ID \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            "CODE_SIGN_IDENTITY[sdk=iphoneos*]=Apple Distribution" \
            "CODE_SIGNING_ALLOWED[sdk=iphoneos*]=YES" \
            "CODE_SIGNING_REQUIRED[sdk=iphoneos*]=YES" \
            "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]=$PROFILE_NAME"

      - name: Export IPA File
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          cd dashboard/ios/App
          
          PROFILE_NAME=$(strings ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision | grep -A 1 "<key>Name</key>" | tail -n 1 | sed -e 's/<string>//' -e 's/<\/string>//' | xargs)

          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.glidesports.glide</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>signingStyle</key>
              <string>manual</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath output
          
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
          
          cd dashboard/ios/App
          xcrun altool --upload-app -f output/App.ipa -t ios --apiKey $API_KEY_ID --apiIssuer $API_ISSUER_ID